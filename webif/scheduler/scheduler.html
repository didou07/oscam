	<script type="text/javascript">
	(function () {
		var t = document.querySelectorAll('td.schedacts');
		for (var i = 0; i < t.length; i++) {
			var c = t[i].firstChild;
			while (c && c.nodeType !== 1) c = c.nextSibling;
			if (c && c.scrollWidth > c.clientWidth) t[i].className += ' more';
		}
	})();
	</script>
